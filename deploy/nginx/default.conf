map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream sky_backend {
    server sky-server:8080;
}

# 管理端：http://localhost
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 管理端源码使用/api作为前缀，后端实际路径为/admin。
    location /api/ {
        proxy_pass http://sky_backend/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location /ws/ {
        proxy_pass http://sky_backend/ws/;
        proxy_http_version 1.1;
        # 保留请求Host，避免上游名称sky_backend中的下划线被Tomcat拒绝。
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

# 用户端：http://localhost:8081
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html/user;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 用户端接口本身包含/user等路径，只移除/api前缀。
    location /api/ {
        proxy_pass http://sky_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location /ws/ {
        proxy_pass http://sky_backend/ws/;
        proxy_http_version 1.1;
        # 保留请求Host，避免上游名称sky_backend中的下划线被Tomcat拒绝。
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
