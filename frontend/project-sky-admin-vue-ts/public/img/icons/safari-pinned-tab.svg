<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="MS">
  <!--
    Safari 固定标签页图标（单色，由浏览器着色）
    用点阵字形同源的方块拼出 MS：每格 17px
    M 占 0..4 列、空 1 列、S 占 6..10 列，每字 5 列 × 7 行，字符区左上角 (40, 68)
  -->
  <path fill="#000000" d="M24 24 H232 a24 24 0 0 1 24 24 V208 a24 24 0 0 1 -24 24 H24 a24 24 0 0 1 -24 -24 V48 a24 24 0 0 1 24 -24 Z" />
  <defs>
    <mask id="msCut">
      <rect width="256" height="256" fill="#ffffff" />
      <g fill="#000000">
        <!-- M -->
        <rect x="40" y="68" width="17" height="119" />
        <rect x="57" y="102" width="17" height="17" />
        <rect x="74" y="85" width="17" height="34" />
        <rect x="108" y="85" width="17" height="34" />
        <rect x="125" y="68" width="17" height="119" />
        <!-- S -->
        <rect x="159" y="68" width="85" height="17" />
        <rect x="159" y="85" width="17" height="34" />
        <rect x="176" y="102" width="68" height="17" />
        <rect x="227" y="119" width="17" height="34" />
        <rect x="159" y="153" width="85" height="17" />
        <rect x="159" y="170" width="85" height="17" />
      </g>
    </mask>
  </defs>
  <rect width="256" height="256" fill="#ffffff" mask="url(#msCut)" />
  <!-- S 中间那一横与下两横之间的缺口补齐（避免字被腰斩） -->
  <g mask="url(#msCut)">
    <rect x="176" y="153" width="68" height="34" fill="none" />
  </g>
</svg>
