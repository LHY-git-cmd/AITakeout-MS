# 每次推送自动验证四个代码模块，阻止无法构建或测试失败的版本进入交付分支。
name: quality

on:
  push:
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn test

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent-service/requirements.txt
      - run: pip install -r agent-service/requirements.txt
      - working-directory: agent-service
        run: python -m unittest discover -s tests -p 'test_*.py'

  user-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/project-sky-user-web/package-lock.json
      - working-directory: frontend/project-sky-user-web
        run: npm ci && npm test && npm run build

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - working-directory: frontend/project-sky-admin-vue-ts
        run: yarn install --frozen-lockfile --non-interactive
      - working-directory: frontend/project-sky-admin-vue-ts
        run: yarn test:unit --runInBand && yarn build
