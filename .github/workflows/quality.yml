# 项目质量门禁：分别验证 Java、Python Agent、用户端和管理端，防止任一层静默破坏推荐闭环。
name: quality

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run Java tests
        run: mvn test

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Agent dependencies
        run: pip install -r agent-service/requirements.txt
      - name: Run Agent tests
        working-directory: agent-service
        run: python -m unittest discover -s tests -p 'test_*.py'

  user-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/project-sky-user-web/package-lock.json
      - name: Install user web dependencies
        working-directory: frontend/project-sky-user-web
        run: npm ci
      - name: Test and build user web
        working-directory: frontend/project-sky-user-web
        run: npm test && npm run build

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/project-sky-admin-vue-ts/yarn.lock
      - name: Install admin web dependencies
        working-directory: frontend/project-sky-admin-vue-ts
        run: yarn install --frozen-lockfile
      - name: Test and build admin web
        working-directory: frontend/project-sky-admin-vue-ts
        run: yarn test:unit --runInBand && yarn build
