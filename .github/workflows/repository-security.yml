name: Repository security
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  history-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check reachable history for private files and credentials
        run: python3 scripts/check-git-security.py HEAD
