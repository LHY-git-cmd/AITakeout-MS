sky:
  diet:
    # 本地演示可使用明确标记为SIMULATED的数据；生产配置默认关闭。
    allow-simulated-data: ${DIET_ALLOW_SIMULATED_DATA:true}
  agent:
    user-agent-public-rag-enabled: ${USER_AGENT_PUBLIC_RAG_ENABLED:true}
    user-agent-reminder-enabled: ${USER_AGENT_REMINDER_ENABLED:true}
    user-agent-cancellation-enabled: ${USER_AGENT_CANCELLATION_ENABLED:true}
    user-agent-after-sale-enabled: ${USER_AGENT_AFTER_SALE_ENABLED:true}
    user-agent-redis-runtime-enabled: ${USER_AGENT_REDIS_RUNTIME_ENABLED:false}
    base-url: ${AGENT_BASE_URL:http://localhost:8000}
    connect-timeout: 5000 #建立 TCP 连接的超时时间（毫秒）
    read-timeout: 60000 #连接成功后，等待服务端响应数据的超时时间（毫秒）
    request-timeout: 65000 #整体请求的超时上限（毫秒）
    context-character-limit: 12000 #单次请求最多携带的历史消息总字符数
    summary-message-threshold: 20 #消息条数阈值_触发摘要
    summary-token-threshold: 5000 #Token估算阈值_触发摘要
    summary-recent-message-count: 10 #保留最近十条
    default-model: ${LLM_MODEL}
    default-temperature: 0.2
    rag-enabled: ${RAG_ENABLED:true}
    rag-top-k: ${RAG_TOP_K:8}
    rag-score-threshold: ${RAG_SCORE_THRESHOLD:0.35}
    embedding-model: ${EMBEDDING_MODEL:BAAI/bge-m3}
    knowledge-index-timeout-seconds: ${PUBLIC_KB_INDEX_TIMEOUT_SECONDS:1800}
    internal-service-token: ${AGENT_INTERNAL_SERVICE_TOKEN:}
    tool-confirmation-ttl-seconds: ${TOOL_CONFIRMATION_TIMEOUT_SECONDS:300}
    recovery-enabled: true
    message-cache-enabled: true
    message-cache-key-prefix: "sky:admin-agent:messages:"
    user-message-cache-key-prefix: "sky:user-agent:messages:"
    message-cache-ttl-seconds: 1800
  cors:
    allowed-origin-patterns:
      - "http://localhost:[*]"
      - "http://127.0.0.1:[*]"
      - "http://10.*:[*]"
      - "http://172.*:[*]"
      - "http://192.168.*:[*]"
  datasource:
    driver-class-name: ${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:3306}
    database: ${DB_NAME:sky_take_out}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  alioss:
    endpoint: ${ALIOSS_ENDPOINT:}
    access-key-id: ${ALIOSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIOSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIOSS_BUCKET_NAME:}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:123456}
    database: ${REDIS_DATABASE:10}
  wechat:
    appid: ${WECHAT_APP_ID:}
    secret: ${WECHAT_APP_SECRET:}
    # 开发环境没有微信支付商户号时启用模拟支付
    mock-pay: true
  auth:
    # 本地 HTTP 开发需要允许浏览器发送 Refresh Cookie；生产环境由 application.yml 默认开启 Secure。
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  avatar:
    local-enabled: true
    local-root: ${AVATAR_LOCAL_ROOT:data/uploads}
  delivery:
    map-provider: ${DELIVERY_MAP_PROVIDER:mock}
    shop-address: ${SHOP_ADDRESS:北京市海淀区上地十街10号}
    baidu-ak: ${BAIDU_MAP_AK:}
    near-distance-meters: 3000
    max-distance-meters: 5000
    near-fee-cent: 500
    far-fee-cent: 800
    preview-ttl-seconds: 300
    pricing-rule-version: delivery-v1
    preview-secret: ${CHECKOUT_PREVIEW_SECRET:development-checkout-preview-secret-change-me}
