sky:
  agent:
    base-url: http://localhost:8000
    connect-timeout: 5000 #建立 TCP 连接的超时时间（毫秒）
    read-timeout: 60000 #连接成功后，等待服务端响应数据的超时时间（毫秒）
    request-timeout: 65000 #整体请求的超时上限（毫秒）
    context-character-limit: 12000 #单次请求最多携带的历史消息总字符数
    summary-message-threshold: 20 #消息条数阈值_触发摘要
    summary-token-threshold: 5000 #Token估算阈值_触发摘要
    summary-recent-message-count: 10 #保留最近十条
    default-model: deepseek-v4-pro
    default-temperature: 0.7
    recovery-enabled: true
    message-cache-enabled: true
    message-cache-key-prefix: "sky:agent:messages:"
    message-cache-ttl-seconds: 1800
  cors:
    allowed-origin-patterns:
      - "http://localhost:[*]"
      - "http://127.0.0.1:[*]"
      - "http://10.*:[*]"
      - "http://172.*:[*]"
      - "http://192.168.*:[*]"
  web-login:
    enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: localhost
    port: 3306
    database: sky_take_out
    username: root
    password: 123
  alioss:
    endpoint: ##
    access-key-id: ##
    access-key-secret: ##
    bucket-name: ##
  redis:
    host: localhost
    port: 6379
    password: 123456
    database: 10
  wechat:
    appid: wx97c3724defa2be41
    secret: 9960c7712f3a82d068aa14121671d939
    # 开发环境没有微信支付商户号时启用模拟支付
    mock-pay: true
