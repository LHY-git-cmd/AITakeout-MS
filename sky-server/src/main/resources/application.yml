server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
      validation-query: SELECT 1
  data:
    redis:
      host: ${sky.redis.host}
      port: ${sky.redis.port}
      password: ${sky.redis.password}
      database: ${sky.redis.database}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration
    validate-on-migrate: true
  ai:
    model:
      chat: ${AI_CHAT_MODEL:none}
      embedding: BAAI/bge-m3
      image: none
      audio:
        transcription: none
        speech: none
      moderation: none
    chat:
      client:
        enabled: ${AI_ENABLED:false}
    rag:
      enabled: true
      vector-store:
        similarity-top-k: 5
        similarity-score-threshold: 0.7
    agent:
      client:
        enabled: true # Assuming this is how to enable multipart AgentClient
    openai:
      api-key: ${LLM_API_KEY:}
      base-url: ${LLM_BASE_URL:}
      chat:
        completions-path: /v1/chat/completions
        options:
          model: ${LLM_MODEL:}
          reasoning-effort: ${LLM_REASONING_EFFORT:high}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: info
        service: info
        controller: info

sky:
  web-login:
    enabled: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:9528,http://localhost:8081}
  jwt:
    # 设置jwt签名加密时使用的秘钥（至少32个字符）
    admin-secret-key: ${JWT_ADMIN_SECRET}
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    user-secret-key: ${JWT_USER_SECRET}
    user-ttl: 7200000
    user-token-name: authentication
  alioss:
    endpoint: ${sky.alioss.endpoint}
    access-key-secret: ${sky.alioss.access-key-secret}
    access-key-id: ${sky.alioss.access-key-id}
    bucket-name: ${sky.alioss.bucket-name}
  wechat:
    appid: ${sky.wechat.appid}
    secret: ${sky.wechat.secret}
  shop:
    address: ${SHOP_ADDRESS:北京市海淀区上地十街10号}
  baidu:
    ak: ${BAIDU_MAP_AK:}
  delivery:
    max-distance: 5000
  order-task:
    batch-size: ${ORDER_TASK_BATCH_SIZE:200}
  ai:
    enabled: ${AI_ENABLED:false}
    daily-limit: 10
    context-message-limit: 20
    retention-days: 90
    generation-timeout: 60s
