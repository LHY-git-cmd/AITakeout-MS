spring:
  datasource:
    druid:
      driver-class-name: org.h2.Driver
      url: jdbc:h2:mem:sky_take_out;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
      username: sa
      password:
  data:
    redis:
      host: localhost
      port: 6379
      database: 15
  task:
    scheduling:
      enabled: false
  flyway:
    enabled: false

sky:
  payment:
    scheduling-enabled: false
  agent:
    base-url: http://localhost:8000
    default-model: test-model
    recovery-enabled: false
  jwt:
    admin-secret-key: test-admin-secret-key-test-admin-secret-key
    admin-ttl: 7200000
    admin-token-name: token
    user-secret-key: test-user-secret-key-test-user-secret-key
    user-ttl: 7200000
    user-token-name: authentication
  alioss:
    endpoint: test
    access-key-secret: test
    access-key-id: test
    bucket-name: test
  wechat:
    appid: test
    secret: test
  shop:
    address: test
  baidu:
    ak:
  delivery:
    map-provider: mock
    shop-address: 测试门店
    near-distance-meters: 3000
    max-distance-meters: 5000
    near-fee-cent: 500
    far-fee-cent: 800
    preview-ttl-seconds: 300
    pricing-rule-version: delivery-v1
    preview-secret: test-checkout-preview-secret-at-least-32-chars
  ai:
    enabled: false
    daily-limit: 10
    context-message-limit: 20
    retention-days: 90
    generation-timeout: 60s
